<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="icon" href="https://static.nowcoder.com/images/logo_87_87.png"/>
    <title>牛论坛-重置密码</title>
</head>
<body>
	<div>
		<p>
			<b th:text="${email}">xxx@xxx.com</b>, 您好!
		</p>
		<p>
			您正在找回牛论坛账号的密码, 系统已为您重置了新密码:
			<b th:text="${password}">xxxxx</b><br/>
			请使用新密码登录, 登录后建议尽快修改密码!
		</p>
	</div>
</body>
</html>
